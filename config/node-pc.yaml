# convoy-safe — Nodo PC (leader del banco de pruebas)
# Ver docs/09-banco-de-pruebas.md.
#
# Cualquier valor se puede sobrescribir por variable de entorno, que gana sobre
# el archivo (ver convoy/config.py). Útil para no editar el YAML cuando cambia
# la red:
#   CONVOY_NODE_ID, CONVOY_NODE_ROLE, CONVOY_TRANSPORT,
#   CONVOY_UDP_BIND, CONVOY_UDP_PEERS (separados por coma), CONVOY_LOG_LEVEL

node:
  id: 1
  role: leader
  priority_order: 1

transport:
  kind: udp
  udp:
    bind: "0.0.0.0:45550"
    # Nombre mDNS en vez de IP: la Pi tiene una sola interfaz, así que su .local
    # resuelve sin ambigüedad y sobrevive a que el DHCP le cambie la dirección.
    peers: ["eevee.local:45550"]

simulation:
  enabled: false
  delay_ms: 340
  loss: 0.10

log:
  # Sin path a propósito: en el banco de pruebas el log va a stderr.
  level: info

audio:
  tts_voice: "es"
