# convoy-safe — Nodo Raspberry Pi (follower del banco de pruebas)
# Ver docs/09-banco-de-pruebas.md.
#
# Cualquier valor se puede sobrescribir por variable de entorno, que gana sobre
# el archivo (ver convoy/config.py). Útil para no editar el YAML cuando cambia
# la red:
#   CONVOY_NODE_ID, CONVOY_NODE_ROLE, CONVOY_TRANSPORT,
#   CONVOY_UDP_BIND, CONVOY_UDP_PEERS (separados por coma), CONVOY_LOG_LEVEL

node:
  id: 2
  role: follower
  priority_order: 2

transport:
  kind: udp
  udp:
    bind: "0.0.0.0:45550"
    # Acá va una IP y no un nombre .local: la PC tiene varias interfaces
    # (Docker, etc.), así que su nombre mDNS resuelve ambiguo y puede devolver
    # una dirección inalcanzable. Si el DHCP le cambia la IP a la PC, pasarla
    # por CONVOY_UDP_PEERS sin tocar este archivo.
    peers: ["192.168.25.159:45550"]

simulation:
  enabled: false
  delay_ms: 340
  loss: 0.10

log:
  # Sin path a propósito: en el banco de pruebas el log va a stderr.
  level: info

audio:
  tts_voice: "es"
